<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arup Browser</title>
<style>
:root{--bg:#f1f3f4;--bar:#fff;--tx:#202124;--mut:#5f6368;--ac:#1a73e8;--bd:#dadce0;--tab:#dee1e6;--tabA:#fff}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){--bg:#202124;--bar:#35363a;--tx:#e8eaed;--mut:#9aa0a6;--ac:#8ab4f8;--bd:#4a4b4f;--tab:#202124;--tabA:#35363a}}
:root[data-t=dark]{--bg:#202124;--bar:#35363a;--tx:#e8eaed;--mut:#9aa0a6;--ac:#8ab4f8;--bd:#4a4b4f;--tab:#202124;--tabA:#35363a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
button{background:none;border:0;color:var(--tx);cursor:pointer;border-radius:50%;width:32px;height:32px;font-size:16px;flex-shrink:0}
button:hover{background:rgba(128,128,128,.25)}button:disabled{opacity:.3;cursor:default}
#tabs{display:flex;align-items:flex-end;background:var(--tab);padding:6px 6px 0;gap:2px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:6px;min-width:90px;max-width:210px;flex:1;padding:7px 8px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--mut);position:relative}
.tab.a{background:var(--tabA);color:var(--tx)}
.tab span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab img{width:16px;height:16px}.tab b{width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;font-weight:400}.tab b:hover{background:rgba(128,128,128,.3)}
.tab.l::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--ac);animation:ld 1s infinite}
@keyframes ld{from{left:-40%}to{left:100%}}
#plus{margin-bottom:3px}
#bar{display:flex;align-items:center;gap:4px;background:var(--bar);padding:6px 8px;border-bottom:1px solid var(--bd)}
#url{flex:1;min-width:0;border:1px solid transparent;background:var(--bg);color:var(--tx);border-radius:20px;padding:8px 16px;font-size:14px;outline:0}
#url:focus{border-color:var(--ac);background:var(--bar)}
#bm{display:flex;gap:4px;background:var(--bar);padding:3px 8px;border-bottom:1px solid var(--bd);overflow-x:auto;min-height:30px;align-items:center}
.bk{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:14px;cursor:pointer;white-space:nowrap;font-size:13px}.bk:hover{background:rgba(128,128,128,.25)}.bk img{width:14px;height:14px}
#warn{display:none;background:#fef7e0;color:#5f4b00;padding:5px 12px;font-size:13px;justify-content:space-between;align-items:center}
#warn a{color:#1a56c4;margin-left:10px}
#view{flex:1;position:relative;background:var(--bar)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}iframe.a{display:block}
#nt{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding-top:12vh;background:var(--bg);overflow:auto}
#nt h1{font-size:44px;margin:0 0 20px;font-weight:500}
#nt input{width:min(560px,90%);padding:13px 20px;border-radius:28px;border:1px solid var(--bd);background:var(--bar);color:var(--tx);font-size:16px;outline:0}
#tiles{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px;justify-content:center;width:min(640px,92%)}
.tile{width:100px;text-align:center;cursor:pointer;padding:12px 4px;border-radius:12px}.tile:hover{background:rgba(128,128,128,.2)}
.tile i{display:flex;width:48px;height:48px;border-radius:50%;background:var(--bar);margin:0 auto 6px;align-items:center;justify-content:center}.tile img{width:26px;height:26px}
.tile div{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--bar);border-left:1px solid var(--bd);z-index:50;display:none;flex-direction:column;box-shadow:-4px 0 16px rgba(0,0,0,.25)}
#panel header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);font-weight:600}
#plist{flex:1;overflow:auto;padding:6px}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer}.row:hover{background:rgba(128,128,128,.2)}
.row .t{flex:1;overflow:hidden}.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row small{color:var(--mut)}
#menu{position:fixed;right:10px;top:84px;background:var(--bar);border:1px solid var(--bd);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);display:none;z-index:60;min-width:200px;padding:6px}
#menu div{padding:9px 12px;border-radius:6px;cursor:pointer}#menu div:hover{background:rgba(128,128,128,.2)}
.set{padding:14px;display:flex;flex-direction:column;gap:8px}.set input,.set select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.set .btn{padding:9px;border-radius:8px;background:var(--ac);color:#fff;border:0;cursor:pointer;width:auto;height:auto;font-size:14px}
</style>
</head>
<body>
<div id="tabs"><button id="plus" title="New tab (Ctrl+T)" onclick="newTab()">＋</button></div>
<div id="bar">
  <button id="bk" onclick="nav(-1)" title="Back (Alt+←)">←</button>
  <button id="fw" onclick="nav(1)" title="Forward (Alt+→)">→</button>
  <button onclick="reload()" title="Reload (F5)">↻</button>
  <button onclick="go(S.home)" title="Home">⌂</button>
  <input id="url" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
  <button id="star" onclick="toggleBm()" title="Bookmark this page (Ctrl+D)">☆</button>
  <button onclick="openExt()" title="Open in real browser tab">↗</button>
  <button onclick="toggleMenu(event)" title="Menu">⋮</button>
</div>
<div id="bm"></div>
<div id="warn"><span>Blank page / sad face? Start the proxy: run <b>node server.js</b> in this folder (Node 18+).<a href="#" onclick="openExt();return false">Open in real tab ↗</a><a href="#" onclick="openPanel('settings');return false">Set a proxy</a></span><button onclick="this.parentNode.style.display='none';S.hideWarn=1;save()">✕</button></div>
<div id="view">
  <div id="nt"><h1>Arup Browser</h1><input id="ntq" placeholder="Search the web or type a URL" autofocus><div id="tiles"></div></div>
</div>
<div id="menu">
  <div onclick="newTab();hideMenu()">New tab</div>
  <div onclick="openPanel('history');hideMenu()">History</div>
  <div onclick="openPanel('bookmarks');hideMenu()">Bookmarks</div>
  <div onclick="toggleTheme();hideMenu()">Toggle dark / light</div>
  <div onclick="openPanel('settings');hideMenu()">Settings</div>
</div>
<div id="panel"><header><span id="ptitle"></span><button onclick="closePanel()">✕</button></header><div id="plist"></div></div>

<script>
const $=id=>document.getElementById(id);
const ENG={DuckDuckGo:'https://html.duckduckgo.com/html/?q=',Bing:'https://www.bing.com/search?q=',Google:'https://www.google.com/search?igu=1&q=',Wikipedia:'https://en.wikipedia.org/w/index.php?search='};
let S={engine:'DuckDuckGo',home:'',proxy:'',theme:'auto',hideWarn:0,bm:[{t:'Wikipedia',u:'https://en.wikipedia.org'},{t:'DuckDuckGo',u:'https://duckduckgo.com'},{t:'MDN',u:'https://developer.mozilla.org'},{t:'GitHub',u:'https://github.com'}],hist:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem('arup_browser')||'{}'))}catch(e){}
if(!S.v2){S.v2=1;if(!S.proxy)S.proxy='http://localhost:3000/?url='}
const save=()=>{try{localStorage.setItem('arup_browser',JSON.stringify(S))}catch(e){}};
let tabs=[],active=null,tid=0;
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
const fav=u=>`https://www.google.com/s2/favicons?sz=32&domain=${host(u)}`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toUrl(q){
  q=q.trim();if(!q)return'';
  if(/^(https?:)\/\//i.test(q))return q;
  if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/.test(q)||/^localhost(:\d+)?/.test(q))return'https://'+q;
  return ENG[S.engine]+encodeURIComponent(q);
}
const viaProxy=u=>S.proxy?S.proxy+encodeURIComponent(u):u;

function newTab(url){
  const f=document.createElement('iframe');
  f.setAttribute('allow','fullscreen; clipboard-write');
  f.setAttribute('referrerpolicy','no-referrer');
  const t={id:++tid,url:'',title:'New Tab',h:[],i:-1,f,loading:false};
  f.onload=()=>{t.loading=false;renderTabs()};
  $('view').appendChild(f);tabs.push(t);switchTab(t.id);
  if(url)go(url);else showNT();
  return t;
}
const T=()=>tabs.find(t=>t.id===active);
function switchTab(id){
  active=id;tabs.forEach(t=>t.f.classList.toggle('a',t.id===id));
  renderTabs();sync();
}
function closeTab(id,e){
  e&&e.stopPropagation();
  const i=tabs.findIndex(t=>t.id===id);tabs[i].f.remove();tabs.splice(i,1);
  if(!tabs.length)return newTab();
  if(active===id)switchTab(tabs[Math.min(i,tabs.length-1)].id);else renderTabs();
}
function renderTabs(){
  document.querySelectorAll('.tab').forEach(e=>e.remove());
  tabs.forEach(t=>{
    const d=document.createElement('div');d.className='tab'+(t.id===active?' a':'')+(t.loading?' l':'');
    d.innerHTML=`${t.url?`<img src="${fav(t.url)}" onerror="this.style.display='none'">`:'🌐'}<span>${esc(t.title)}</span><b>✕</b>`;
    d.onclick=()=>switchTab(t.id);d.lastChild.onclick=e=>closeTab(t.id,e);d.onauxclick=e=>{if(e.button===1)closeTab(t.id,e)};
    $('tabs').insertBefore(d,$('plus'));
  });
}
function showNT(){
  const on=!T().url;$('nt').style.display=on?'flex':'none';
  if(on){
    $('tiles').innerHTML='';
    S.bm.slice(0,12).forEach(b=>{const d=document.createElement('div');d.className='tile';d.innerHTML=`<i><img src="${fav(b.u)}"></i><div>${esc(b.t)}</div>`;d.onclick=()=>go(b.u);$('tiles').appendChild(d)});
    if(document.activeElement!==$('url'))setTimeout(()=>$('ntq').focus(),0);
  }
}
function go(input,push=true){
  const t=T();const u=toUrl(input||S.home);
  if(!u){t.url='';t.title='New Tab';t.f.removeAttribute('src');sync();renderTabs();return}
  if(push){t.h=t.h.slice(0,t.i+1);t.h.push(u);t.i=t.h.length-1}
  t.url=u;t.title=host(u);t.loading=true;t.f.src=viaProxy(u);
  S.hist.unshift({u,t:t.title,d:Date.now()});S.hist=S.hist.slice(0,300);save();
  $('warn').style.display=S.hideWarn?'none':'flex';
  sync();renderTabs();
}
function nav(d){
  const t=T();const n=t.i+d;
  if(n<-1||n>=t.h.length)return;
  if(n===-1){t.i=-1;t.url='';t.title='New Tab';t.f.removeAttribute('src');sync();renderTabs();return}
  t.i=n;go(t.h[n],false);
}
function reload(){const t=T();if(!t.url)return;t.loading=true;t.f.src='about:blank';setTimeout(()=>t.f.src=viaProxy(t.url),30);renderTabs()}
function sync(){
  const t=T();if(!t)return;
  $('url').value=t.url;$('bk').disabled=t.i<0;$('fw').disabled=t.i>=t.h.length-1;
  $('star').textContent=S.bm.some(b=>b.u===t.url)?'★':'☆';
  $('star').style.color=S.bm.some(b=>b.u===t.url)?'#fbbc04':'';
  $('warn').style.display=t.url&&!S.hideWarn?'flex':'none';
  showNT();renderBm();document.title=(t.url?t.title+' – ':'')+'Arup Browser';
}
function renderBm(){
  const b=$('bm');b.innerHTML='';
  if(!S.bm.length)b.innerHTML='<small style="color:var(--mut)">Bookmarks appear here (☆ or Ctrl+D)</small>';
  S.bm.forEach(x=>{const d=document.createElement('div');d.className='bk';d.title=x.u;d.innerHTML=`<img src="${fav(x.u)}"><span>${esc(x.t)}</span>`;d.onclick=()=>go(x.u);
    d.oncontextmenu=e=>{e.preventDefault();if(confirm('Remove bookmark "'+x.t+'"?')){S.bm=S.bm.filter(y=>y!==x);save();sync()}};b.appendChild(d)});
}
function toggleBm(){
  const t=T();if(!t.url)return;
  const i=S.bm.findIndex(b=>b.u===t.url);
  if(i>=0)S.bm.splice(i,1);else S.bm.push({t:prompt('Bookmark name',t.title)||t.title,u:t.url});
  save();sync();
}
function openExt(){const t=T();window.open(t.url||S.home||'about:blank','_blank','noopener')}

// Panels
function openPanel(kind){
  const p=$('panel'),l=$('plist');p.style.display='flex';l.innerHTML='';
  $('ptitle').textContent={history:'History',bookmarks:'Bookmarks',settings:'Settings'}[kind];
  if(kind==='settings'){
    l.innerHTML=`<div class="set"><label>Search engine</label><select id="s-eng">${Object.keys(ENG).map(k=>`<option ${k===S.engine?'selected':''}>${k}</option>`).join('')}</select>
    <label>Homepage (blank = new tab page)</label><input id="s-home" value="${esc(S.home)}" placeholder="https://...">
    <label>Proxy prefix (optional, e.g. your own proxy URL ending with ?url=)</label><input id="s-proxy" value="${esc(S.proxy)}" placeholder="https://your-proxy.example/?url=">
    <label>Theme</label><select id="s-theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <button class="btn" onclick="saveSet()">Save</button><button class="btn" style="background:#d93025" onclick="clearHist()">Clear history</button></div>`;
    $('s-theme').value=S.theme;return;
  }
  const items=kind==='history'?S.hist.map(h=>({t:h.t,u:h.u,s:new Date(h.d).toLocaleString()})):S.bm.map(b=>({t:b.t,u:b.u,s:b.u}));
  if(!items.length)l.innerHTML='<div class="row"><small>Nothing here yet</small></div>';
  items.forEach(x=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<img src="${fav(x.u)}" width="16" height="16"><div class="t"><div>${esc(x.t)}</div><small>${esc(x.s)}</small></div>`;d.onclick=()=>{go(x.u);closePanel()};l.appendChild(d)});
}
function closePanel(){$('panel').style.display='none'}
function saveSet(){S.engine=$('s-eng').value;S.home=$('s-home').value.trim();S.proxy=$('s-proxy').value.trim();S.theme=$('s-theme').value;save();applyTheme();closePanel()}
function clearHist(){S.hist=[];save();closePanel()}
function applyTheme(){if(S.theme==='auto')document.documentElement.removeAttribute('data-t');else document.documentElement.dataset.t=S.theme}
function toggleTheme(){const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#202124';S.theme=dark?'light':'dark';save();applyTheme()}
function toggleMenu(e){e.stopPropagation();const m=$('menu');m.style.display=m.style.display==='block'?'none':'block'}
function hideMenu(){$('menu').style.display='none'}

// Events
$('url').addEventListener('keydown',e=>{if(e.key==='Enter'){go($('url').value);e.target.blur()}if(e.key==='Escape'){sync();e.target.blur()}});
$('url').addEventListener('focus',e=>e.target.select());
$('ntq').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){go(e.target.value);e.target.value=''}});
document.addEventListener('click',hideMenu);
document.addEventListener('keydown',e=>{
  const c=e.ctrlKey||e.metaKey;
  if(c&&e.key==='t'){e.preventDefault();newTab()}
  else if(c&&e.key==='w'){e.preventDefault();closeTab(active)}
  else if(c&&e.key==='l'){e.preventDefault();$('url').focus()}
  else if(c&&e.key==='d'){e.preventDefault();toggleBm()}
  else if(c&&e.key==='h'){e.preventDefault();openPanel('history')}
  else if(e.altKey&&e.key==='ArrowLeft')nav(-1);
  else if(e.altKey&&e.key==='ArrowRight')nav(1);
  else if(e.key==='F5'){e.preventDefault();reload()}
  else if(c&&e.key==='Tab'){e.preventDefault();const i=tabs.findIndex(t=>t.id===active);switchTab(tabs[(i+1)%tabs.length].id)}
});
window.addEventListener('message',e=>{
  const d=e.data;if(!d||!d.arup)return;
  const t=tabs.find(x=>x.f.contentWindow===e.source);if(!t)return;
  if(d.title)t.title=d.title;
  if(d.url&&d.url!==t.url){t.h=t.h.slice(0,t.i+1);t.h.push(d.url);t.i=t.h.length-1;t.url=d.url;S.hist.unshift({u:d.url,t:t.title,d:Date.now()});S.hist=S.hist.slice(0,300);save()}
  if(t.id===active)sync();renderTabs();
});
applyTheme();newTab(S.home||undefined);
</script>
</body>
</html>
